<!doctype html>
<html lang="es-SV">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111117"><meta name="description" content="ATENEA de SPARTAN GYM COMALAPA. Ejercicios ilustrados, hábitos y progreso a tu ritmo.">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ATENEA · SPARTAN GYM COMALAPA</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css?v=3.5">
<script src="./data.js?v=3.5" defer></script><script src="./menus.js?v=3.5" defer></script><script src="./app.js?v=3.5" defer></script>
</head>
<body>
<div id="wallpaper-layer" aria-hidden="true"></div>
<div id="splash" aria-label="Cargando ATENEA"><div class="splash-inner"><img src="./assets/logo.jpg" alt="SPARTAN GYM" class="logo"><span class="comalapa">COMALAPA</span><span class="splash-name">ATENEA</span><p>Fuerza que nace de ti.</p><div class="load-track"><span></span></div><span class="loading-label">Cargando tu espacio…</span></div></div>
<div class="app-shell">
<section class="gym-banner" aria-label="SPARTAN GYM COMALAPA"><img src="./assets/logo.jpg" alt="SPARTAN GYM"><span class="comalapa">COMALAPA</span><span class="atenea-label">ATENEA</span></section>
<header class="topbar"><a href="#home" class="brand-word">ATENEA</a><div class="top-actions"><button class="icon-button" id="sound" aria-label="Silenciar sonidos" title="Sonidos"></button><button class="icon-button" id="share" aria-label="Compartir ATENEA" title="Compartir"></button><button class="install-button" id="install">Instalar</button></div></header>
<main id="app" tabindex="-1"></main>
<footer><span class="footer-brand">SPARTAN GYM · COMALAPA</span><button class="text-button" data-action="about">Acerca de ATENEA</button><button class="text-button" data-action="gym">El gimnasio en Google</button><a class="text-button" href="./actualizar.html">Actualizar ATENEA · v3.5</a><small>power by: yuri</small>
<div class="atenea-views" aria-label="Contador de visitas de ATENEA" style="display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px auto 0;padding:13px 16px;border:1px solid #564060;border-radius:15px;background:#211b2c;color:#eadcf8;font-size:15px">
<svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
<span>Visitas a ATENEA:</span> <strong id="atenea-view-count" aria-live="polite">Cargando…</strong>
</div></footer>
</div>
<div id="timer" class="timer hidden" role="status" aria-label="Tiempo de descanso"><div><span>Descanso</span><strong id="timer-value">01:00</strong></div><button id="timer-toggle" class="icon-button" aria-label="Pausar descanso"></button><button id="timer-close" class="icon-button" aria-label="Cerrar descanso"></button></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="modal"><div id="modal-content"></div><button class="secondary wide" id="close-modal">Cerrar</button></dialog>
<input id="wallpaper-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
<input id="import-file" type="file" accept="application/json,.json" hidden>
<noscript><div class="noscript">Activa JavaScript en el navegador para ver los ejercicios y guardar tu progreso.</div></noscript>
<script>
(function(){
  var el=document.getElementById('atenea-view-count');
  if(!el)return;
  var base='https://abacus.jasoncameron.dev/';
  var path='spartangymcomalapa/atenea-visits';
  var key='atenea-visit-counted-v1';
  var action='get';
  try{if(!sessionStorage.getItem(key)){sessionStorage.setItem(key,'1');action='hit';}}catch(e){action='get';}
  fetch(base+action+'/'+path,{cache:'no-store',signal:AbortSignal.timeout?AbortSignal.timeout(8000):undefined})
    .then(function(r){if(!r.ok)throw Error('API '+r.status);return r.json();})
    .then(function(d){if(typeof d.value!=='number'||!Number.isFinite(d.value))throw Error('Valor no válido');el.textContent=new Intl.NumberFormat('es-SV').format(d.value);})
    .catch(function(){el.textContent='No disponible';});
})();
</script>
<script>setTimeout(function(){var s=document.getElementById('splash');if(s)s.remove()},2600)</script>
</body></html>
